name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify JavaScript syntax
        run: |
          node --check background.js
          node --check content.js
          node --check popup.js
          node --check lib/extractor.js
          node --check scripts/package.js

      - name: Validate manifest.json format
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            if (manifest.manifest_version !== 3) throw new Error('manifest_version must be 3');
            if (!manifest.name) throw new Error('Missing extension name');
            if (!manifest.version) throw new Error('Missing extension version');
            console.log('Manifest V3 validation passed for version: ' + manifest.version);
          "

      - name: Run test suite
        run: npm test

      - name: Package extension bundle
        run: npm run package

      - name: Upload extension build artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-quiz-solver-dist
          path: dist/*.zip
